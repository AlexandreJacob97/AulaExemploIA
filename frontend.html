<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de tarefas</title>
    <style>
      body {
        max-width: 640px;
        margin: 3rem auto;
        padding: 0 1rem;
        color: #202124;
        font: 16px/1.5 system-ui, sans-serif;
      }

      li { margin: 0.75rem 0; }
      .concluida { color: #52605a; }
      #mensagem { color: #a12622; }
    </style>
  </head>
  <body>
    <main>
      <h1>Lista de tarefas</h1>
      <p id="mensagem" role="status">Carregando tarefas...</p>
      <ul id="lista-tarefas"></ul>
    </main>

    <script>
      async function carregarTarefas() {
        const mensagem = document.querySelector("#mensagem");
        const lista = document.querySelector("#lista-tarefas");

        try {
          const resposta = await fetch("/api/tarefas");
          if (!resposta.ok) {
            throw new Error(`A API respondeu com o status ${resposta.status}`);
          }

          const tarefas = await resposta.json();
          for (const tarefa of tarefas) {
            const item = document.createElement("li");
            item.textContent = `${tarefa.concluida ? "✓" : "○"} ${tarefa.titulo}`;
            if (tarefa.concluida) item.classList.add("concluida");
            lista.append(item);
          }

          mensagem.textContent = tarefas.length
            ? "Tarefas carregadas da API."
            : "Nenhuma tarefa cadastrada.";
        } catch (erro) {
          console.error("Erro ao buscar tarefas:", erro);
          mensagem.textContent = "Não foi possível carregar as tarefas. Verifique se o servidor está em execução.";
        }
      }

      carregarTarefas();
    </script>
  </body>
</html>
